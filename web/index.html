<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime Chat (step 1 test page)</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; height: 360px; overflow-y: auto; padding: 8px; margin: 12px 0; }
  .system { color: #777; font-style: italic; }
  .error { color: #b00; }
  input, button { font: inherit; padding: 6px; }
  form { display: flex; gap: 8px; }
  form input { flex: 1; }
</style>
</head>
<body>
<h1>Realtime Chat</h1>
<p>Step 1 test page. Open it in two tabs with different names to see messages arrive live.</p>
<form id="connect">
  <input id="name" placeholder="your name" required pattern="[A-Za-z0-9_-]{1,32}">
  <input id="room" placeholder="room" value="general" required>
  <button>Connect</button>
</form>
<div id="log"></div>
<form id="send">
  <input id="text" placeholder="message" autocomplete="off" disabled>
  <button disabled>Send</button>
</form>
<script>
let ws, room;
const log = document.getElementById('log');
function show(text, cls) {
  const div = document.createElement('div');
  div.textContent = text;
  if (cls) div.className = cls;
  log.append(div);
  log.scrollTop = log.scrollHeight;
}
function render(m) {
  const t = m.time ? new Date(m.time).toLocaleTimeString() : '';
  if (m.type === 'message') show(`[${t}] ${m.user}: ${m.text}`);
  else if (m.type === 'system') show(m.text, 'system');
  else if (m.type === 'error') show('Error: ' + m.text, 'error');
  else if (m.type === 'history') m.messages.forEach(render);
}
document.getElementById('connect').onsubmit = e => {
  e.preventDefault();
  if (ws) ws.close();
  room = document.getElementById('room').value;
  const name = encodeURIComponent(document.getElementById('name').value);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?name=${name}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', room }));
    document.querySelectorAll('#send input, #send button').forEach(el => el.disabled = false);
    show(`Connected to #${room}`, 'system');
  };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => show('Disconnected', 'error');
};
document.getElementById('send').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('text');
  if (!input.value.trim()) return;
  ws.send(JSON.stringify({ type: 'send', room, text: input.value }));
  input.value = '';
};
</script>
</body>
</html>
