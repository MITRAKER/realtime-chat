# GoReleaser builds and publishes a release when a version tag is pushed.
# Try it locally without publishing: goreleaser release --snapshot --clean
version: 2

project_name: realtime-chat

before:
  hooks:
    - go mod verify

builds:
  - id: server
    main: ./cmd/server
    binary: realtime-chat
    env:
      - CGO_ENABLED=0 # one static binary, no C toolchain needed (JPL rule 8)
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  footer: |
    **Docker image:** `docker pull ghcr.io/mitraker/realtime-chat:{{ .Version }}`

    See [CHANGELOG.md](https://github.com/MITRAKER/realtime-chat/blob/main/CHANGELOG.md) for details.
