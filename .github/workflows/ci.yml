name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every day at 06:17 UTC: static analysis, the vulnerability scan and
    # fuzzing run even when nobody pushes, because new vulnerabilities are
    # published all the time (JPL rule 10: analyze every day).
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: jobs can read the code and nothing else unless they ask.
permissions:
  contents: read

# A new push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (formatting, bugs, style, security, complexity)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: NASA/JPL rules 1 and 2 (no recursion, no goto, documented loops)
        run: go run ./cmd/jplcheck ./...
      - name: ShellCheck (shell scripts)
        run: shellcheck scripts/*.sh

  test:
    name: Test on Go ${{ matrix.go }} (race detector, PostgreSQL, coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two Go releases the Go team still supports.
        go: [oldstable, stable]
    services:
      # A throwaway PostgreSQL just for this job, so database tests run too.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://chat:chat@localhost:5432/chat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Test with coverage (fails below 80%)
        run: ./scripts/coverage.sh coverage.out
      - uses: actions/upload-artifact@v4
        if: always() && matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  vulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      # Reports only vulnerabilities in code this program can actually
      # reach, in its dependencies and in Go's standard library.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build binaries and Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: Cross-compile for every release platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/server
          done
      - uses: docker/setup-buildx-action@v3
      - name: Docker image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fuzz:
    name: Fuzz tests (daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: Fuzz each target for one minute
        run: ./scripts/fuzz.sh 60s
      # If the fuzzer finds a crash, it saves the input under testdata/fuzz.
      # Keep it so the bug can be reproduced and added as a regression test.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  # One check to require in branch protection: it passes only when every
  # job above passed (the fuzz job is skipped on pull requests, which is fine).
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, vulncheck, build, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
