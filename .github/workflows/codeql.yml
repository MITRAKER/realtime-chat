name: CodeQL

# GitHub's semantic code analysis: it follows data through the program to
# find security bugs such as injection, unsafe input handling and leaked
# secrets. Results appear under the repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC

permissions:
  contents: read

# As in ci.yml: only a newer push to the same pull request cancels a run.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload results to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
